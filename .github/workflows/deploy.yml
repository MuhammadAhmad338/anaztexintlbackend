name: Deploy BackEnd to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            # Navigate to the project directory
            # Note: I used /home/ubuntu based on your script, but ${{ secrets.EC2_USER }} is safer
            cd /home/${{ secrets.EC2_USER }}/anaztexintlbackend || cd /home/ubuntu/anaztexintlbackend
            
            # Update the code
            git reset --hard origin/main
            git pull origin main
            
            # Install dependencies
            npm install
            
            # Restart or start the application
            pm2 restart anaztexintlbackend || pm2 start index.js --name anaztexintlbackend
            
            # Save the PM2 process list
            pm2 save